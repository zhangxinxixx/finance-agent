name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contracts
    runs-on: ubuntu-latest
    env:
      FINANCE_AGENT_DISABLE_BACKGROUND_JOBS: "1"
      UV_CACHE_DIR: /tmp/uv-cache
      no_proxy: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Compile Python sources
        run: uv run python -m compileall -q apps database dagster_finance scripts
      - name: Lint backend and tests
        run: uv run ruff check apps tests
      - name: Run core analysis and execution regression tests
        run: >-
          uv run pytest -q
          tests/analysis
          tests/api/test_quality_gate_service.py
          tests/api/test_agent_analysis_api.py
          tests/api/test_agent_read_model.py
          tests/api/test_agent_analysis_inspect_api.py
          tests/worker/test_agentloop_fallback_pipeline.py
          tests/worker/test_premarket_composite_output_integration.py
          tests/worker/test_premarket_composite_db_integration.py
          tests/runtime
          tests/monitoring/test_data_quality_monitor.py
          tests/data_control/test_data_control_agent.py
          tests/event_sla/test_event_sla_pipeline.py
          tests/scripts/test_run_event_sla_pipeline.py
          tests/orchestration
          tests/scheduler/test_automation_orchestration.py
          tests/dagster_finance/test_automation_orchestration_schedule.py
          tests/api/test_orchestration_api.py
          tests/scripts/test_run_automation_orchestrator.py
          tests/contracts
          tests/architecture
      - name: Run warehouse, page-boundary and retention regression tests
        run: >-
          uv run pytest -q -m 'not live'
          tests/database
          tests/data_layer
          tests/api/test_page_data_boundary.py
          tests/api/test_research_clock_contract.py
          tests/api/test_research_state_routes.py
          tests/api/test_macro_read_model_service.py
          tests/api/test_dashboard_research_service.py
          tests/api/test_research_trade_plan.py
          tests/worker/test_research_input_validation.py
          tests/worker/test_rejected_output_retention.py
          tests/dagster_finance/test_warehouse_maintenance.py
          tests/scripts/test_prune_raw_sources.py
          tests/scripts/test_prune_unqualified_outputs.py
          tests/scripts/test_backfill_data_warehouse.py
          tests/scripts/test_benchmark_jin10_vlm.py
          tests/scripts/test_run_report_window_scan.py
          tests/test_conftest_fixtures.py
          tests/worker/test_dagster_agent_ops.py

