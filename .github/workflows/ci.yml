  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/frontend-web/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm typecheck
      - name: Test frontend contracts
        run: pnpm test
      - name: Build frontend
        run: pnpm build

  analysis-memory-postgres:
    name: Analysis Memory PostgreSQL
    runs-on: ubuntu-latest
    env:
      ANALYSIS_MEMORY_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/finance_agent_test
      UV_CACHE_DIR: /tmp/uv-cache
      no_proxy: 127.0.0.1,localhost,::1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: finance_agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d finance_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install Python dependencies
        run: uv sync --locked --extra dev
      - name: Run PostgreSQL migration and CAS checks
        shell: bash
        run: >-
          mkdir -p test-results &&
          uv run pytest -q --tb=short
          --junitxml=test-results/analysis-memory-postgres.xml
          tests/database/test_public_postgres_upgrade.py
      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-memory-postgres-test-results
          path: test-results/analysis-memory-postgres.xml
          if-no-files-found: warn
